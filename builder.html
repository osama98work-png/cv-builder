<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwSEEpu5FyJggjZHV33y9Ja-KaAQYRTi_k3gR92ghlAoD_m_dFv8JLTbFtwh6sZBwo/exec';
    const BLOGGER_PAGE_URL = "https://osama98work-png.github.io/cv-builder/cv.html";

    let isEnglish = false;
    let currentUserStatus = "Not Active"; 
    let currentUserUID = ""; 
    let base64ImageGlobal = "";
    let savedData = { ar: { name: '', title: '', bio: '', edu: '', skills: '', langs: '' }, en: { name: '', title: '', bio: '', edu: '', skills: '', langs: '' } };

    // ⚠️ قائمة القوالب الـ 15 (بدون أي أخطاء)
    const themesList = [
        { id: 'theme-default', name: 'الكلاسيكي', color: 'linear-gradient(135deg, #3498db, #2980b9)' },
        { id: 'theme-dark', name: 'الداكن', color: 'linear-gradient(135deg, #2c3e50, #1a252f)' },
        { id: 'theme-minimal', name: 'البسيط', color: 'linear-gradient(135deg, #16a085, #1abc9c)' },
        { id: 'theme-elegant', name: 'الأنيق', color: 'linear-gradient(135deg, #722F37, #5a252b)' },
        { id: 'theme-creative', name: 'الإبداعي', color: 'linear-gradient(135deg, #FF6D00, #e65c00)' },
        { id: 'theme-harvard', name: 'هارفارد', color: '#ffffff', border: '#000000' },
        { id: 'theme-techie', name: 'التقني', color: '#121212', border: '#00e676' },
        { id: 'theme-boldheader', name: 'الجريء', color: 'linear-gradient(to bottom, #FFC107 40%, #ffffff 40%)', border: '#bdc3c7' },
        { id: 'theme-scandi', name: 'الاسكندنافي', color: '#fafafa', border: '#e0e0e0' },
        { id: 'theme-timeline', name: 'المسار الزمني', color: 'linear-gradient(to left, #ffffff 80%, #3498db 20%)', border: '#bdc3c7' },
        { id: 'theme-neumorphic', name: 'ثلاثي الأبعاد', color: '#e0e5ec', border: '#ffffff' },
        { id: 'theme-executive', name: 'التنفيذي', color: 'linear-gradient(to bottom, #1a2a6c 40%, #f2a900 40%, #f2a900 45%, #ffffff 45%)', border: '#1a2a6c' },
        { id: 'theme-soft', name: 'المودرن الناعم', color: 'linear-gradient(135deg, #fdfbfb, #ebedee)', border: '#f3e5f5' },
        { id: 'theme-industrial', name: 'الصناعي', color: '#343a40', border: '#ffc107' },
        { id: 'theme-royal', name: 'الملكي', color: '#111111', border: '#d4af37' }
    ];

    function showToast(message, isError = false) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.style.backgroundColor = isError ? "#e74c3c" : "#27ae60";
        toast.className = "show";
        setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    function goToStep(stepId) {
        if(stepId === 'step-themes' && document.getElementById('step-data').classList.contains('active')) {
            silentSaveData();
        }

        document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
        const targetElement = document.getElementById(stepId);
        if(!targetElement) { stepId = 'step-data'; document.getElementById(stepId).classList.add('active'); } 
        else { targetElement.classList.add('active'); }

        localStorage.setItem('cv_current_step', stepId); 
        
        const iframeBox = document.getElementById('persistentIframe');
        const fab = document.getElementById('scrollFAB');
        const logoutBtn = document.getElementById('logoutBtn');

        if(stepId === 'step-welcome' || stepId === 'step-login') {
            iframeBox.style.display = 'none'; fab.style.display = 'none'; logoutBtn.style.display = 'none';
        } else {
            logoutBtn.style.display = 'flex';
            if(stepId === 'step-themes' || stepId === 'step-export') {
                iframeBox.style.display = 'block'; fab.style.display = 'flex';
            } else {
                iframeBox.style.display = 'none'; fab.style.display = 'none';
            }
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if(stepId === 'step-themes' || stepId === 'step-export') liveUpdateIframe();
    }

    function scrollToPreview() { document.getElementById('persistentIframe').scrollIntoView({ behavior: 'smooth' }); }

    function logout() {
        if(confirm("هل أنت متأكد من تسجيل الخروج؟")) {
            localStorage.clear(); location.reload();
        }
    }

    window.onload = function() {
        buildThemeGallery(); 
        const cachedEmail = localStorage.getItem('cv_email');
        if (cachedEmail) { 
            document.getElementById('resumeSessionBtn').style.display = 'block';
            resumeSession();
        } 
    };

    function buildThemeGallery() {
        const gallery = document.getElementById('themeGallery');
        gallery.innerHTML = '';
        const currentSelectedTheme = localStorage.getItem('cv_theme') || savedData.selectedTheme || 'theme-default';
        themesList.forEach(theme => {
            const isActive = theme.id === currentSelectedTheme ? 'active' : '';
            gallery.innerHTML += `<div class="theme-card ${isActive}" onclick="selectTheme('${theme.id}')"><div class="theme-thumb" style="background:${theme.color}; border:1px solid ${theme.border||'transparent'}"></div><div class="theme-name">${theme.name}</div></div>`;
        });
    }

    function selectTheme(themeId) {
        savedData.selectedTheme = themeId;
        localStorage.setItem('cv_theme', themeId);
        buildThemeGallery(); liveUpdateIframe(); 
    }

    // ⚠️ الدالة اللي كانت ضايعة رجعت بسلام ⚠️
    function liveUpdateIframe() {
        const frame = document.getElementById('previewFrame');
        if(!frame || !frame.contentWindow) return;
        const currentTheme = localStorage.getItem('cv_theme') || savedData.selectedTheme || 'theme-default';
        frame.contentWindow.postMessage({
            type: 'LIVE_PREVIEW',
            payload: {
                theme: currentTheme, isEnglish: isEnglish, status: currentUserStatus,
                data: {
                    name: document.getElementById('inputName').value || (isEnglish ? 'Your Name' : 'الاسم الكامل'),
                    title: document.getElementById('inputTitle').value || (isEnglish ? 'Job Title' : 'المسمى الوظيفي'),
                    email: document.getElementById('inputEmail').value || 'Email',
                    phone: document.getElementById('inputPhone').value || 'Phone',
                    bio: document.getElementById('inputBio').value || '...',
                    edu: document.getElementById('inputEdu').value,
                    skills: document.getElementById('inputSkills').value,
                    langs: document.getElementById('inputLangs').value,
                    image: base64ImageGlobal
                }
            }
        }, '*');
    }

    async function handleGoogleLogin(response) {
        try {
            let base64Url = response.credential.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            const payload = JSON.parse(jsonPayload);
            loginProcess(payload.email, payload.name);
        } catch(e) { showToast("❌ خطأ في قراءة بيانات غوغل", true); }
    }

    async function resumeSession() {
        const email = localStorage.getItem('cv_email');
        const name = localStorage.getItem('cv_name') || "عزيزي المستخدم";
        if(email) loginProcess(email, name);
    }

    async function loginProcess(userEmail, userName) {
        localStorage.setItem('cv_email', userEmail);
        localStorage.setItem('cv_name', userName);
        document.getElementById('systemMsg').innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';
        document.getElementById('inputEmail').value = userEmail;
        document.getElementById('inputName').value = userName;

        try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "fetch", email: userEmail }) });
            const data = await res.json();
            
            if(data.status === "success") {
                try { savedData = JSON.parse(data.cvData); } catch(e) {} 
                currentUserStatus = data.userStatus; 
                currentUserUID = data.uid || ""; 
                if(savedData.userImageBase64) { base64ImageGlobal = "data:image/jpeg;base64," + savedData.userImageBase64; }
                
                if(savedData.ar) {
                    document.getElementById('inputName').value = savedData.ar.name || userName;
                    document.getElementById('inputTitle').value = savedData.ar.title || '';
                    document.getElementById('inputBio').value = savedData.ar.bio || '';
                    document.getElementById('inputEdu').value = savedData.ar.edu || '';
                    document.getElementById('inputSkills').value = savedData.ar.skills || '';
                    document.getElementById('inputLangs').value = savedData.ar.langs || '';
                }
                document.getElementById('inputPhone').value = savedData.phone || '';
                
                buildThemeGallery();
                checkVipStatus();
            } else {
                currentUserStatus = "Not Active";
                fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "save", email: userEmail, fullName: userName, cvData: savedData, receipt: "", image: "" }) });
            }
            
            document.getElementById('systemMsg').innerText = "";
            showToast("✅ تمت المصادقة بنجاح!");
            
            let targetStep = localStorage.getItem('cv_current_step');
            if (!targetStep || targetStep === 'step-welcome' || targetStep === 'step-login') { targetStep = 'step-data'; }
            goToStep(targetStep);

        } catch (e) { document.getElementById('systemMsg').innerText = "❌ فشل الاتصال بالسيرفر. تأكد من الإنترنت."; }
    }

    function silentSaveData() {
        const email = document.getElementById('inputEmail').value;
        if(!email) return;
        const currentLang = isEnglish ? 'en' : 'ar';
        if(!savedData[currentLang]) savedData[currentLang] = {};
        savedData[currentLang].name = document.getElementById('inputName').value; 
        savedData[currentLang].title = document.getElementById('inputTitle').value; 
        savedData[currentLang].bio = document.getElementById('inputBio').value; 
        savedData[currentLang].edu = document.getElementById('inputEdu').value; 
        savedData[currentLang].skills = document.getElementById('inputSkills').value; 
        savedData[currentLang].langs = document.getElementById('inputLangs').value;
        savedData.email = email; savedData.phone = document.getElementById('inputPhone').value;
        savedData.activeLang = currentLang; savedData.selectedTheme = localStorage.getItem('cv_theme') || 'theme-default';
        
        let rawBase64 = base64ImageGlobal ? base64ImageGlobal.split(',')[1] : "";
        fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "save", email: email, fullName: document.getElementById('inputName').value, cvData: savedData, image: rawBase64, receipt: "" }) });
    }

    function toggleLayout() {
        isEnglish = !isEnglish;
        const currentLang = isEnglish ? 'en' : 'ar';
        document.getElementById('inputName').value = savedData[currentLang].name || '';
        document.getElementById('inputTitle').value = savedData[currentLang].title || '';
        document.getElementById('inputBio').value = savedData[currentLang].bio || '';
        document.getElementById('inputEdu').value = savedData[currentLang].edu || '';
        document.getElementById('inputSkills').value = savedData[currentLang].skills || '';
        document.getElementById('inputLangs').value = savedData[currentLang].langs || '';
        liveUpdateIframe();
    }

    async function autoTranslate() {
        const btn = event.currentTarget;
        const payloadData = { action: "translate", texts: { name: document.getElementById('inputName').value, title: document.getElementById('inputTitle').value, bio: document.getElementById('inputBio').value, edu: document.getElementById('inputEdu').value, skills: document.getElementById('inputSkills').value, langs: document.getElementById('inputLangs').value } };
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; 
        try {
            const response = await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payloadData) });
            const result = await response.json();
            if(result.status === "success") {
                savedData.en = result.translated;
                if(!isEnglish) toggleLayout(); else { toggleLayout(); toggleLayout(); } 
                showToast("✅ تمت الترجمة!");
            }
        } catch (e) { showToast("❌ خطأ بالترجمة.", true); }
        btn.innerHTML = '<i class="fas fa-magic"></i> ترجمة';
    }

    function previewPhoto(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_SIZE = 250;
                let width = img.width; let height = img.height;
                if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                base64ImageGlobal = canvas.toDataURL('image/jpeg', 0.8);
                liveUpdateIframe(); 
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function saveAndGoToExport() {
        const btn = document.getElementById('saveBtn');
        const email = document.getElementById('inputEmail').value;
        const currentLang = isEnglish ? 'en' : 'ar';
        
        if(!savedData[currentLang]) savedData[currentLang] = {};
        savedData[currentLang].name = document.getElementById('inputName').value; 
        savedData[currentLang].title = document.getElementById('inputTitle').value; 
        savedData[currentLang].bio = document.getElementById('inputBio').value; 
        savedData[currentLang].edu = document.getElementById('inputEdu').value; 
        savedData[currentLang].skills = document.getElementById('inputSkills').value; 
        savedData[currentLang].langs = document.getElementById('inputLangs').value;
        savedData.email = email; savedData.phone = document.getElementById('inputPhone').value;
        savedData.activeLang = currentLang; savedData.selectedTheme = localStorage.getItem('cv_theme') || 'theme-default';
        
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...'; 
        let rawBase64 = base64ImageGlobal ? base64ImageGlobal.split(',')[1] : "";

        try {
            const response = await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "save", email: email, fullName: document.getElementById('inputName').value, cvData: savedData, image: rawBase64, receipt: "" }) });
            const result = await response.json();
            if(result.status === "success") { 
                currentUserUID = result.uid;
                goToStep('step-export'); checkVipStatus();
            }
        } catch (e) { showToast("❌ فشل الحفظ.", true); }
        btn.disabled = false; btn.innerHTML = 'التالي: التصدير <i class="fas fa-arrow-left"></i>';
    }

    function checkVipStatus() {
        let statusText = "🔴 حالة الحساب: مجاني";
        if (currentUserStatus === "Active" && currentUserUID) {
            statusText = "🟢 حالة الحساب: VIP مفعل!";
            document.getElementById('vipLinkArea').style.display = 'block';
            document.getElementById('finalCvLink').value = BLOGGER_PAGE_URL + "?user=" + currentUserUID;
        } else if (currentUserStatus === "Pending") {
            statusText = "🟡 حالة الحساب: قيد المراجعة";
            document.getElementById('vipLinkArea').style.display = 'none';
        }
        document.getElementById('accountStatusMsg').innerHTML = statusText;
        liveUpdateIframe(); 
    }

    function triggerVIP() {
        if (currentUserStatus === "Pending") { showToast("⏳ طلبك قيد المراجعة حالياً.", true); return; }
        if (currentUserStatus === "Active") { showToast("🟢 أنت مشترك VIP بالفعل!"); return; }
        document.getElementById('paymentModal').style.display = 'flex';
    }

    async function submitReceipt() {
        const receiptNum = document.getElementById('receiptInput').value;
        if (!receiptNum) { showToast("⚠️ يرجى إدخال رقم الإشعار!", true); return; }
        const email = document.getElementById('inputEmail').value;
        try {
            const response = await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "save", email: email, fullName: document.getElementById('inputName').value, cvData: savedData, receipt: receiptNum }) });
            const result = await response.json();
            if(result.status === "success") { 
                currentUserStatus = "Pending";
                document.getElementById('paymentModal').style.display = 'none';
                checkVipStatus();
                showToast("✅ تم إرسال الإشعار بنجاح!");
            }
        } catch (e) { showToast("❌ فشل الاتصال.", true); }
    }

    function exportCV(format) {
        showToast(format === 'image' ? "⏳ جاري تجهيز الصورة..." : "🖨️ جاري تجهيز الـ PDF...", false);
        const frame = document.getElementById('previewFrame');
        if(frame && frame.contentWindow) {
            frame.contentWindow.postMessage({ type: 'EXPORT', format: format }, '*');
        }
    }
</script>
