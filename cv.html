<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض السيرة الذاتية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="themes.css">
    
    <style>
        body { background: #eaeff1; padding: 0; font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; margin: 0; }
        * { box-sizing: border-box; }
        
        #status-msg { text-align:center; padding:50px; }
        #cv-container { display:none; max-width: 100%; margin: 0 auto; overflow-x: hidden;}
        
        /* حاوية العدسة */
        .preview-wrapper { width: 100%; background-color: #d1d5db; padding: 20px 0; display: flex; justify-content: center; overflow: hidden; border-radius: 10px; }
        body.is-preview .preview-wrapper { background: transparent; padding: 0; border-radius: 0; }
        
        /* الورقة الثابتة */
        .cv-paper { background: white; width: 210mm !important; min-height: 297mm !important; padding: 0; padding-bottom: 20mm; box-shadow: 0 15px 35px rgba(0,0,0,0.25); position: relative; word-wrap: break-word; overflow-wrap: break-word; margin: 0 auto !important; }

        @media (max-width: 767px) { .cv-paper { zoom: 0.42; } }
        @media (min-width: 768px) { .cv-paper { zoom: 0.75; } }
        
        .cv-contact span { word-break: break-all; }
        .cv-header { display: flex; align-items: center; border-bottom: 2px solid #2c3e50; padding: 20mm 20mm 20px 20mm; margin-bottom: 20px; width: 100%; box-sizing: border-box;}
        .cv-photo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #3498db; margin-left: 20px; display: none; }
        .cv-paper[dir="ltr"] .cv-photo { margin-left: 0; margin-right: 20px; } 
        .cv-header-info { flex: 1; }
        .cv-name { font-size: 28px; font-weight: bold; color: #2c3e50; margin: 0; }
        .cv-title { font-size: 16px; color: #3498db; margin-top: 5px; font-weight: 600; }
        .cv-contact { font-size: 13px; color: #7f8c8d; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .cv-section { margin-bottom: 20px; padding: 0 20mm; width: 100%; box-sizing: border-box;}
        .cv-section-title { font-size: 18px; color: #2c3e50; border-bottom: 1px solid #bdc3c7; margin-bottom: 10px; padding-bottom: 5px; font-weight: bold; }
        .cv-content { font-size: 14px; color: #444; line-height: 1.6; white-space: pre-wrap; }
        .cv-paper[dir="rtl"] { text-align: right; }
        .cv-paper[dir="ltr"] { text-align: left; }
        
        .watermark { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250' transform='rotate(-45)'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='24' font-family='Arial' font-weight='bold' fill='rgba(0,0,0,0.06)'>نسخة غير مدفوعة</text></svg>"); background-repeat: repeat; display: none; }

        @media print { 
            .no-print { display: none !important; } 
            body { background: white !important; margin: 0; padding: 0; }
            #cv-viewer-app { background: white; padding: 0; }
            .preview-wrapper { background: transparent !important; padding: 0 !important; box-shadow: none !important;}
            .cv-paper { zoom: 1 !important; margin: 0 !important; box-shadow: none !important; border-radius: 0; width: 210mm !important; min-height: 297mm !important; }
        }
    </style>
</head>
<body>

    <div id="cv-viewer-app">
        <div id="status-msg"><h2 style="color:#2c3e50;">جاري جلب السيرة الذاتية... ⏳</h2></div>
        <div id="cv-container">
            <div style="text-align:center; padding: 20px;" class="no-print" id="printSection">
                <button onclick="window.print()" style="background:#27ae60; color:white; padding:12px 25px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; font-size:16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">🖨️ طباعة أو حفظ PDF</button>
            </div>

            <div class="preview-wrapper">
                <div class="cv-paper" id="cvTemplate">
                    <div class="watermark" id="watermark"></div>
                    <div class="cv-header" id="sec-header">
                        <img id="cvPhoto" class="cv-photo" src="">
                        <div class="cv-header-info">
                            <h1 class="cv-name" id="cvName"></h1>
                            <div class="cv-title" id="cvTitle"></div>
                            <div class="cv-contact">
                                <span dir="ltr"><i class="fas fa-envelope" style="color: #3498db; margin: 0 5px;"></i> <span id="cvEmail"></span></span> 
                                <span class="contact-separator" style="color: #bdc3c7; margin: 0 5px;">|</span> 
                                <span dir="ltr"><i class="fas fa-phone" style="color: #3498db; margin: 0 5px;"></i> <span id="cvPhone"></span></span>
                            </div>
                        </div>
                    </div>
                    <div class="cv-section" id="sec-bio"><div class="cv-section-title" id="lblBio">الملخص الشخصي</div><div class="cv-content" id="cvBio"></div></div>
                    <div class="cv-section" id="sec-edu"><div class="cv-section-title" id="lblEdu">التعليم والشهادات</div><div class="cv-list" id="cvEdu"></div></div>
                    <div class="cv-section" id="sec-skills"><div class="cv-section-title" id="lblSkills">المهارات</div><div class="cv-list" id="cvSkills"></div></div>
                    <div class="cv-section" id="sec-langs"><div class="cv-section-title" id="lblLangs">اللغات</div><div class="cv-list" id="cvLangs"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwSEEpu5FyJggjZHV33y9Ja-KaAQYRTi_k3gR92ghlAoD_m_dFv8JLTbFtwh6sZBwo/exec';

        // 1. استقبال البيانات الحية من البيلدر عبر (Iframe)
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || data.type !== 'LIVE_PREVIEW') return;
            applyDataToCV(data.payload);
        });

        function loadPublicCV() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // وضع المعاينة (Iframe)
            if (urlParams.get('preview') === 'true') {
                document.body.classList.add('is-preview');
                document.getElementById('printSection').style.display = 'none';
                document.getElementById('status-msg').style.display = 'none';
                document.getElementById('cv-container').style.display = 'block';
                return; // ننتظر الـ message من البيلدر
            }

            // وضع العرض للجمهور (الرابط العادي)
            const uid = urlParams.get('user');
            if (!uid) { document.getElementById('status-msg').innerHTML = "<h2 style='color:#e74c3c;'>❌ عذراً، الرابط غير صحيح.</h2>"; return; }

            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetch_public", uid: uid }) })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    const parsedData = JSON.parse(data.cvData);
                    parsedData.userImageBase64 = data.image; // إضافة الصورة
                    const activeLangData = parsedData.activeLang === 'en' ? parsedData.en : parsedData.ar;
                    
                    const payload = {
                        theme: parsedData.selectedTheme || 'theme-default',
                        isEnglish: parsedData.activeLang === 'en',
                        status: "Active", // الرابط العام دائماً Active
                        data: {
                            name: activeLangData.name, title: activeLangData.title,
                            email: parsedData.email, phone: parsedData.phone,
                            bio: activeLangData.bio, edu: activeLangData.edu,
                            skills: activeLangData.skills, langs: activeLangData.langs,
                            image: data.image ? "data:image/jpeg;base64," + data.image : ""
                        }
                    };
                    applyDataToCV(payload);
                    document.getElementById('status-msg').style.display = 'none';
                    document.getElementById('cv-container').style.display = 'block';
                } 
                else if (data.status === "inactive") { document.getElementById('status-msg').innerHTML = "<h2>🔒 السيرة غير متاحة حالياً.</h2>"; } 
                else { document.getElementById('status-msg').innerHTML = "<h2 style='color:#e74c3c;'>❌ لم يتم العثور على السيرة.</h2>"; }
            }).catch(e => { document.getElementById('status-msg').innerHTML = "<h2>❌ حدث خطأ في الاتصال.</h2>"; });
        }

        // 2. دالة تطبيق البيانات على الـ HTML
        function applyDataToCV(payload) {
            const paper = document.getElementById('cvTemplate');
            paper.className = 'cv-paper ' + payload.theme;
            paper.setAttribute('dir', payload.isEnglish ? 'ltr' : 'rtl');
            
            document.getElementById('lblBio').innerText = payload.isEnglish ? 'Professional Summary' : 'الملخص الشخصي';
            document.getElementById('lblEdu').innerText = payload.isEnglish ? 'Education' : 'التعليم والشهادات';
            document.getElementById('lblSkills').innerText = payload.isEnglish ? 'Skills' : 'المهارات';
            document.getElementById('lblLangs').innerText = payload.isEnglish ? 'Languages' : 'اللغات';

            document.getElementById('cvName').innerText = payload.data.name || '';
            document.getElementById('cvTitle').innerText = payload.data.title || '';
            document.getElementById('cvBio').innerText = payload.data.bio || '';
            
            // إدارة التغبيش والعلامة المائية
            const emailEl = document.getElementById('cvEmail');
            const phoneEl = document.getElementById('cvPhone');
            const watermark = document.getElementById('watermark');
            
            if (payload.status !== "Active") {
                emailEl.innerText = (payload.data.email || 'Email').substring(0, 3) + '*****@***.com';
                phoneEl.innerText = (payload.data.phone || 'Phone').substring(0, 4) + '******';
                emailEl.style.filter = "blur(3px)"; phoneEl.style.filter = "blur(3px)";
                watermark.style.display = "block";
            } else {
                emailEl.innerText = payload.data.email; phoneEl.innerText = payload.data.phone;
                emailEl.style.filter = "none"; phoneEl.style.filter = "none";
                watermark.style.display = "none";
            }

            // رسم القوائم
            renderList(payload.data.edu, 'cvEdu', payload.theme, payload.isEnglish);
            renderList(payload.data.skills, 'cvSkills', payload.theme, payload.isEnglish);
            renderList(payload.data.langs, 'cvLangs', payload.theme, payload.isEnglish);

            // الصورة
            const imgEl = document.getElementById('cvPhoto');
            if(payload.data.image) {
                imgEl.src = payload.data.image;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
        }

        function renderList(linesString, containerId, theme, isEnglish) {
            const container = document.getElementById(containerId);
            if(!linesString) { container.innerHTML = ''; return; }
            const lines = linesString.split('\n').filter(line => line.trim() !== '');
            const bulletColor = theme === 'theme-minimal' ? '#16a085' : '#3498db';
            const align = isEnglish ? 'left' : 'right';
            const dir = isEnglish ? 'ltr' : 'rtl';
            
            let html = `<table width="100%" dir="${dir}" style="border-collapse: collapse; margin: 0; padding: 0; font-size: 14px; color: #444; line-height: 1.6;">`;
            lines.forEach(line => {
                html += `<tr><td style="width: 15px; color: ${bulletColor}; vertical-align: top; text-align: ${align}; padding-top: 2px;">■</td><td style="vertical-align: top; text-align: ${align}; word-break: break-word;">${line}</td></tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        window.onload = loadPublicCV;
    </script>
</body>
</html>
